name: lint-and-sim
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install cocotb==1.9.2
      - name: Lint and simulation
        run: make lint sim
      - name: Synthesis
        run: make synth
